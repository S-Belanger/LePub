<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LePub · Character review</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #15130f; color: #eedabb; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 1120px; margin: auto; }
  h1 { font-size: 30px; margin: 12px 0 4px; }
  p { color: #bcae96; margin: 4px 0 20px; }
  a { color: #e5b76f; }
  nav { display: flex; gap: 24px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; padding: 20px 0; }
  label { display: grid; gap: 6px; font-size: 13px; }
  select, button { background: #2d2920; color: #eedabb; border: 1px solid #665038; padding: 9px 12px; font: inherit; }
  button { cursor: pointer; }
  #cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); gap: 16px; }
  figure { margin: 0; padding: 16px; background: #211e18; }
  figcaption { display: flex; justify-content: space-between; gap: 12px; }
  small { color: #bcae96; }
  canvas { display: block; margin: auto; max-width: 100%; image-rendering: pixelated; }
  #status { display: block; margin: 0 0 20px; color: #bcae96; }
  @media (max-width: 600px) { body { padding: 20px; } }
</style>
<main>
  <nav><a href="../">Play LePub</a><a href="../assets/art-direction/overhead/character-camera-study.png">Camera reference</a></nav>
  <h1>Meet the regulars. And the trouble.</h1>
  <p>Live artwork from the game. Change the direction, pose and display size to inspect the cast.</p>
  <div class="controls">
    <label>Direction<select id="direction"><option value="down">Facing you</option><option value="right">Right</option><option value="up">Facing away</option><option value="left">Left</option></select></label>
    <label>Pose<select id="pose"><option>idle</option><option>walk</option><option>carry</option><option>carryWalk</option><option>gunWalk</option><option>drink</option><option>talk</option><option>lean</option><option>slump</option><option>spray</option></select></label>
    <label>Size<select id="scale"><option value="4">Desktop size</option><option value="2">Phone size</option><option value="8">2× inspection</option></select></label>
    <button id="pause" type="button" aria-pressed="false">Pause animation</button>
  </div>
  <output id="status">Loading the cast…</output>
  <div id="cast"></div>
</main>
<script src="../src/assets.js"></script>
<script src="../src/character-art.js"></script>
<script>
  const names = Object.fromEntries(Object.entries(CharacterArt.families).map(([family, spec]) => [family, spec.name]));
  const cards = [];
  const direction = document.getElementById('direction'), pose = document.getElementById('pose'), scale = document.getElementById('scale');
  pose.replaceChildren(...[...new Set(Object.values(CharacterArt.families).flatMap(spec => Object.keys(spec.animations)))].map(name => new Option(name, name)));
  let paused = matchMedia('(prefers-reduced-motion: reduce)').matches, time = 0, previous = 0;
  const pause = document.getElementById('pause');
  function syncPause() { pause.textContent = paused ? 'Play animation' : 'Pause animation'; pause.setAttribute('aria-pressed', String(paused)); }
  pause.onclick = () => { paused = !paused; syncPause(); };
  syncPause();
  Assets.configure(Assets.browserIO());
  Assets.loadManifest('../assets/sprites/manifest.json').then(() => {
    for (const [family, name] of Object.entries(names)) {
      const figure = document.createElement('figure'), caption = document.createElement('figcaption');
      const title = document.createElement('span'), state = document.createElement('small'), canvas = document.createElement('canvas');
      title.textContent = name; caption.append(title, state); canvas.width = 288; canvas.height = 220;
      canvas.setAttribute('role', 'img'); canvas.setAttribute('aria-label', name + ' sprite preview');
      figure.append(caption, canvas); document.getElementById('cast').append(figure);
      cards.push({ family, canvas, state });
    }
    const ready = Object.values(Assets.status()).filter(a => a.state === 'ready').length;
    document.getElementById('status').textContent = ready + ' of ' + Object.keys(names).length + ' characters loaded. Characters without the selected pose show their idle pose.';
    requestAnimationFrame(draw);
  });
  function draw(now) {
    if (!paused && previous) time += Math.min(100, now - previous);
    previous = now;
    for (const { family, canvas, state } of cards) {
      const g = canvas.getContext('2d'); g.clearRect(0, 0, canvas.width, canvas.height); g.imageSmoothingEnabled = false;
      let actual = pose.value, frame = Assets.frameFor(family, actual + '.' + direction.value, time);
      if (!frame) { actual = 'idle'; frame = Assets.frameFor(family, actual + '.' + direction.value, time); }
      state.textContent = frame ? actual : 'Unavailable';
      if (!frame) continue;
      const s = Number(scale.value) / frame.density;
      g.drawImage(frame.image, frame.rect.x, frame.rect.y, frame.rect.width, frame.rect.height,
        Math.round(144 - frame.pivot.x * s), Math.round(205 - frame.pivot.y * s), frame.rect.width * s, frame.rect.height * s);
    }
    requestAnimationFrame(draw);
  }
</script>
</html>
