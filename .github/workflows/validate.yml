name: Validate game and character art
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Syntax of every shipped script, then the art contract, asset
      # registry, smoke run and Alex scheduling tests.
      - run: node tests/run.js
