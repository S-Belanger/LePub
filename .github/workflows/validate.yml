name: Validate game and character art
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/character-art.js
      - run: node tests/assets.js
      - run: node tests/smoke.js
      - run: node tests/alex.js
